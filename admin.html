
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pannello Admin</title>
    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="login-container" class="container">
        <h2>Admin Login</h2>
        <form id="login-form">
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Accedi</button>
            <p id="login-error" class="error-msg"></p>
        </form>
    </div>

    <div id="admin-dashboard" class="container hidden">
        <header>
            <h2>Pannello di Controllo</h2>
            <button id="logout-btn" class="logout-btn">Esci</button>
        </header>
        
        <form id="settings-form">
            <!-- Testi -->
            <section class="settings-section">
                <h3>Testi Principali</h3>
                <div class="form-group">
                    <label>Sottotitolo (es. Il mio diciottesimo)</label>
                    <input type="text" id="text-subtitle">
                </div>
                <div class="form-group">
                    <label>Titolo (es. 18)</label>
                    <input type="text" id="text-title">
                </div>
                <div class="form-group">
                    <label>Tagline (es. Un nuovo capitolo...)</label>
                    <input type="text" id="text-tagline">
                </div>
                <div class="form-group">
                    <label>Data Evento</label>
                    <input type="text" id="text-date">
                </div>
                <div class="form-group">
                    <label>Orario Evento</label>
                    <input type="text" id="text-time">
                </div>
                <div class="form-group">
                    <label>Indirizzo Evento</label>
                    <input type="text" id="text-address">
                </div>
                <div class="form-group">
                    <label>Testo Intro (Benvenuti)</label>
                    <textarea id="text-intro" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Nome Location (es. La Villa Esclusiva)</label>
                    <input type="text" id="text-location-name">
                </div>
                <div class="form-group">
                    <label>Dress Code - Titolo</label>
                    <input type="text" id="text-dresscode-title">
                </div>
                <div class="form-group">
                    <label>Dress Code - Descrizione</label>
                    <textarea id="text-dresscode-desc" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>Testo Finale</label>
                    <input type="text" id="text-finale">
                </div>
            </section>

            <!-- Colori -->
            <section class="settings-section">
                <h3>Colori</h3>
                <div class="form-group color-group">
                    <label>Sfondo Principale (--bg-color)</label>
                    <div class="color-input-wrapper">
                        <input type="color" id="color-bg">
                        <input type="text" id="color-bg-text" placeholder="#030308">
                    </div>
                </div>
                <div class="form-group color-group">
                    <label>Sfondo Alternativo (--bg-alt)</label>
                    <div class="color-input-wrapper">
                        <input type="text" id="color-bg-alt" placeholder="rgba(10, 10, 20, 0.4)">
                    </div>
                </div>
                <div class="form-group color-group">
                    <label>Colore Principale/Accento (--gold)</label>
                    <div class="color-input-wrapper">
                        <input type="color" id="color-gold">
                        <input type="text" id="color-gold-text" placeholder="#d4af37">
                    </div>
                </div>
                <div class="form-group color-group">
                    <label>Testo Principale (--text-primary)</label>
                    <div class="color-input-wrapper">
                        <input type="color" id="color-text-primary">
                        <input type="text" id="color-text-primary-text" placeholder="#ffffff">
                    </div>
                </div>
                <div class="form-group color-group">
                    <label>Testo Secondario (--text-secondary)</label>
                    <div class="color-input-wrapper">
                        <input type="color" id="color-text-secondary">
                        <input type="text" id="color-text-secondary-text" placeholder="#aaaaaa">
                    </div>
                </div>
            </section>

            <button type="submit" id="save-btn" class="save-btn">Salva Impostazioni</button>
            <p id="save-status" class="status-msg"></p>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

</body>
